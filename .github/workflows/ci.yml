name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI · PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@localhost:5432/portfolio_test
      TEST_DATABASE_URL: postgresql+psycopg://portfolio:portfolio@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models and migrations are in sync
        run: alembic check

      - name: Seed smoke test (idempotent)
        run: |
          python -m app.database.seed
          python -m app.database.seed

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (React · TypeScript · Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test -- --run

      - name: Production build
        env:
          VITE_SITE_URL: http://localhost:8080
        run: npm run build

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: youssra-portfolio-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: youssra-portfolio-frontend:latest
          load: true
          build-args: VITE_SITE_URL=http://localhost:8080
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          sed -i "s|^ENVIRONMENT=.*|ENVIRONMENT=production|" .env
          docker compose config --quiet
          docker compose up --detach --wait --wait-timeout 180

      - name: Smoke test through nginx
        run: |
          set -eu
          curl --fail --silent --show-error http://localhost:8080/ | grep -q 'id="root"'
          curl --fail --silent --show-error http://localhost:8080/api/health | grep -q '"database":"connected"'
          curl --fail --silent --show-error http://localhost:8080/api/portfolio \
            | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data["profile"]["full_name"] and data["projects"]; print("projects:", len(data["projects"]))'
          curl --fail --silent --show-error http://localhost:8080/sitemap.xml | grep -q '<urlset'
          curl --fail --silent --show-error --head http://localhost:8080/projects/unknown-route | grep -qi 'content-security-policy'
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/api/docs

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
