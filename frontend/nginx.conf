# nginx configuration of the portfolio website container (installed as /etc/nginx/conf.d/default.conf,
# i.e. inside the http {} block of the stock nginx.conf).
#
# * Serves the Vite build (SPA fallback to index.html, immutable hashed assets, no-cache index.html, gzip).
# * Proxies /api/, /robots.txt and /sitemap.xml to the FastAPI service ("backend:8000" on the compose network).
# * Security headers + strict Content-Security-Policy on everything nginx serves itself. Proxied API
#   responses keep the backend's own headers (backend/app/middleware/security_headers.py), including its
#   relaxed CSP for /api/docs and /api/redoc (Swagger UI / ReDoc load their bundles from cdn.jsdelivr.net).
#   In nginx an empty header value means "do not send", which is how the maps below avoid duplicated or
#   conflicting headers on proxied paths.

# ---- Headers for what nginx serves itself (empty for proxied paths) --------------------------------------
map $uri $portfolio_proxied {
    ~^/api/         1;
    /robots.txt     1;
    /sitemap.xml    1;
    default         0;
}

map $portfolio_proxied $portfolio_csp {
    1       "";
    default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
}
map $portfolio_proxied $portfolio_nosniff          { 1 ""; default "nosniff"; }
map $portfolio_proxied $portfolio_frame_options    { 1 ""; default "DENY"; }
map $portfolio_proxied $portfolio_referrer_policy  { 1 ""; default "strict-origin-when-cross-origin"; }
map $portfolio_proxied $portfolio_permissions      { 1 ""; default "camera=(), microphone=(), geolocation=()"; }

# ---- Caching: hashed build assets forever, the HTML entry point always revalidated -------------------------
map $uri $portfolio_cache_control {
    ~^/api/         "";
    /robots.txt     "";
    /sitemap.xml    "";
    ~^/assets/      "public, max-age=31536000, immutable";
    /index.html     "no-cache";
    default         "public, max-age=86400";
}

# ---- Original scheme when a TLS-terminating proxy sits in front, otherwise the connection's own ---------
map $http_x_forwarded_proto $portfolio_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    client_max_body_size 1m;

    # Real client IP when another reverse proxy (Caddy, Traefik, a load balancer...) sits in front of this
    # container on a private network. Direct visitors cannot spoof it: their address is not trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               application/manifest+json image/svg+xml;

    add_header Content-Security-Policy $portfolio_csp always;
    add_header X-Content-Type-Options $portfolio_nosniff always;
    add_header X-Frame-Options $portfolio_frame_options always;
    add_header Referrer-Policy $portfolio_referrer_policy always;
    add_header Permissions-Policy $portfolio_permissions always;
    add_header Cache-Control $portfolio_cache_control;

    # Docker's embedded DNS: the backend address is re-resolved if its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portfolio_backend http://backend:8000;

    # ---- Single-page application -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # ---- Backend (FastAPI) ---------------------------------------------------------------------------------
    location /api/ {
        proxy_pass $portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $portfolio_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /robots.txt {
        proxy_pass $portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $portfolio_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass $portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $portfolio_forwarded_proto;
    }
}
